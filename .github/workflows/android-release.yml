name: Android Play Store bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AABs (BinLink Eco + BinLink Collector)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Write .env
        run: echo "${{ secrets.DOTENV_B64 }}" | base64 -d > .env

      - name: Write upload keystore + key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing keystore secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=binlink\nstoreFile=keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          # Fails the run if the password or alias is wrong, instead of silently debug-signing.
          keytool -list -v -keystore android/app/keystore.jks -alias binlink \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|Valid until"

      - name: Dependencies
        run: flutter pub get --suppress-analytics

      - name: Build BinLink Eco AAB
        run: flutter build appbundle --release --flavor household -t lib/main_household.dart --suppress-analytics

      - name: Build BinLink Collector AAB
        run: flutter build appbundle --release --flavor collector -t lib/main_collector.dart --suppress-analytics

      - name: Verify release signing
        run: |
          for f in build/app/outputs/bundle/*Release/*.aab; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            jarsigner -verify -verbose:summary -certs "$f" | grep -E "CN=|jar verified" | head -3
            if jarsigner -verify -certs "$f" | grep -q "CN=Android Debug"; then
              echo "ERROR: $f is debug-signed"; exit 1
            fi
          done
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p out
          cp build/app/outputs/bundle/householdRelease/app-household-release.aab "out/BinLink-Eco-$VERSION.aab"
          cp build/app/outputs/bundle/collectorRelease/app-collector-release.aab "out/BinLink-Collector-$VERSION.aab"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: play-store-aabs
          path: out/*.aab
          retention-days: 14
