name: Android Play Store bundles

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Send both apps to this Google Play track (none = only build the files)'
        type: choice
        options: [internal, alpha, none]
        default: internal
      notes:
        description: 'What changed (shown to testers, max 500 characters)'
        type: string
        default: 'Bug fixes and improvements.'

permissions:
  contents: read

jobs:
  build:
    name: Build AABs (BinLink Eco + BinLink Collector)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Write .env
        run: echo "${{ secrets.DOTENV_B64 }}" | base64 -d > .env

      - name: Write upload keystore + key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing keystore secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=binlink\nstoreFile=keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          # Fails the run if the password or alias is wrong, instead of silently debug-signing.
          keytool -list -v -keystore android/app/keystore.jks -alias binlink \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|Valid until"

      - name: Dependencies
        run: flutter pub get --suppress-analytics

      # Google Play refuses a build number it has seen before, so every run gets a new, higher one
      # (1000 + run number; the first Play upload was 31). The version name stays from pubspec.yaml.
      - name: Pick build number
        run: |
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_ENV"

      - name: Build BinLink Eco AAB
        run: flutter build appbundle --release --flavor household -t lib/main_household.dart --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" --suppress-analytics

      - name: Build BinLink Collector AAB
        run: flutter build appbundle --release --flavor collector -t lib/main_collector.dart --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" --suppress-analytics

      - name: Verify release signing
        run: |
          for f in build/app/outputs/bundle/*Release/*.aab; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            jarsigner -verify -verbose:summary -certs "$f" | grep -E "CN=|jar verified" | head -3
            if jarsigner -verify -certs "$f" | grep -q "CN=Android Debug"; then
              echo "ERROR: $f is debug-signed"; exit 1
            fi
          done
          VERSION="$BUILD_NAME+$BUILD_NUMBER"
          mkdir -p out
          cp build/app/outputs/bundle/householdRelease/app-household-release.aab "out/BinLink-Eco-$VERSION.aab"
          cp build/app/outputs/bundle/collectorRelease/app-collector-release.aab "out/BinLink-Collector-$VERSION.aab"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: play-store-aabs
          path: out/*.aab
          retention-days: 14

      # ---- Upload to Google Play (needs the PLAY_SERVICE_ACCOUNT_JSON secret) ----
      - name: Check Play upload settings
        id: play
        if: ${{ inputs.track != 'none' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundles were built but not uploaded."
            echo "upload=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p whatsnew
          printf '%s' "${NOTES:0:500}" > whatsnew/whatsnew-en-US
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload BinLink Eco to Google Play
        if: ${{ steps.play.outputs.upload == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.binlink.eco
          releaseFiles: out/BinLink-Eco-*.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: whatsnew

      - name: Upload BinLink Collector to Google Play
        if: ${{ steps.play.outputs.upload == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.binlink.collector
          releaseFiles: out/BinLink-Collector-*.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: whatsnew
