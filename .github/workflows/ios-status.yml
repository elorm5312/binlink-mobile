name: iOS App Store status

# Manual, read-only: shows builds, TestFlight state and App Store versions (about a minute).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install -q pyjwt cryptography
          /tmp/asc/bin/python .github/scripts/asc_status.py com.binlink.eco com.binlink.collector
