name: Keep backend awake

# Render's free plan sleeps after 15 min idle and the first request then takes
# ~30 s (slow login/booking). Ping it every 10 minutes. GitHub may delay
# scheduled runs, so this reduces cold starts rather than guaranteeing none;
# Render's paid plan removes them entirely.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://binlink-backend.onrender.com/health
