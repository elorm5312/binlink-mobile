# BinLink — Codemagic CI/CD (iOS + Android)
#
# iOS: both apps are built from the single "Runner" Xcode target. The flavor is
# chosen by the Dart entry point (-t lib/main_<flavor>.dart); the bundle ID and
# display name are set on the Xcode project right before each build.
#
# One-time setup in the Codemagic dashboard:
#   Team settings > Integrations > Developer Portal > add an App Store Connect
#   API key and name the integration exactly "BinLink".
# One-time setup in App Store Connect: app records for com.binlink.eco and
# com.binlink.collector must exist before the first upload.

definitions:
  email: &email
    email:
      recipients:
        - starbwoycrash808@gmail.com
      notify:
        success: true
        failure: true

workflows:
  ios-release:
    name: iOS — BinLink Eco + Collector → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BinLink
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier:
          - com.binlink.eco
          - com.binlink.collector
      flutter: 3.38.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter dependencies
        script: flutter pub get

      - name: CocoaPods
        script: cd ios && pod install --repo-update

      - name: Build BinLink Eco (household)
        script: |
          set -e
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*binlinkMobile;/PRODUCT_BUNDLE_IDENTIFIER = com.binlink.eco;/' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BinLink Eco" ios/Runner/Info.plist
          xcode-project use-profiles
          flutter build ipa --release \
            -t lib/main_household.dart \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
          mkdir -p build/ios/output
          cp build/ios/ipa/*.ipa build/ios/output/BinLink-Eco.ipa
          rm -rf build/ios/ipa

      - name: Build BinLink Collector
        script: |
          set -e
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.binlink.eco;/PRODUCT_BUNDLE_IDENTIFIER = com.binlink.collector;/' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BinLink Collector" ios/Runner/Info.plist
          xcode-project use-profiles
          flutter build ipa --release \
            -t lib/main_collector.dart \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
          cp build/ios/ipa/*.ipa build/ios/output/BinLink-Collector.ipa
    artifacts:
      - build/ios/output/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      <<: *email

  android-all:
    name: Android — both APKs
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.1
      java: 17
      groups:
        - binlink_android
      vars:
        KEYSTORE_PATH: $CM_BUILD_DIR/android/app/keystore.jks
    scripts:
      - name: Flutter dependencies
        script: flutter pub get
      - name: Decode keystore
        script: echo $KEYSTORE_BASE64 | base64 --decode > $KEYSTORE_PATH
      - name: Build both APKs
        script: |
          flutter build apk --release --flavor household -t lib/main_household.dart
          flutter build apk --release --flavor collector -t lib/main_collector.dart
          mkdir -p build/outputs
          cp build/app/outputs/flutter-apk/app-household-release.apk build/outputs/BinLink-Eco.apk
          cp build/app/outputs/flutter-apk/app-collector-release.apk build/outputs/BinLink-Collector.apk
    artifacts:
      - build/outputs/*.apk
    publishing:
      <<: *email
